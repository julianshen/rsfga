# Docker Compose for local development and testing
#
# Usage:
#   docker-compose up -d          # Start all services (API + Postgres)
#   docker-compose up -d rsfga-memory  # Start RSFGA with in-memory storage
#   docker-compose --profile nats up -d  # Start with NATS async writes
#   docker-compose --profile edge up -d  # Start with edge sync
#   docker-compose --profile precompute up -d  # Start with precomputed checks
#   docker-compose logs -f rsfga  # View logs
#   docker-compose down           # Stop all services
#   docker-compose down -v        # Stop and remove volumes
#
# Ports:
#   8080  - RSFGA API (postgres backend)
#   8081  - RSFGA API (memory backend, requires --profile memory)
#   9092  - rsfga-writer metrics (host 9092 → container 9090)
#   9091  - rsfga-edge metrics
#   9090  - Prometheus (requires --profile observability)
#   16686 - Jaeger UI (requires --profile observability)

services:
  # RSFGA with PostgreSQL backend (production-like)
  rsfga:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RSFGA_SERVER__HOST=0.0.0.0
      - RSFGA_SERVER__PORT=8080
      - RSFGA_STORAGE__BACKEND=postgres
      - RSFGA_STORAGE__DATABASE_URL=postgres://rsfga:rsfga@postgres:5432/rsfga
      - RSFGA_STORAGE__POOL_SIZE=10
      - RSFGA_LOGGING__LEVEL=info
      - RSFGA_LOGGING__JSON=false
      - RSFGA_METRICS__ENABLED=true
      # Precompute cache (requires --features precompute at build time).
      # When using `docker-compose --profile precompute up`, uncomment these
      # to connect to the valkey service defined below:
      #   RSFGA_PRECOMPUTE__ENABLED=true
      #   RSFGA_PRECOMPUTE__VALKEY_URL=redis://valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # RSFGA with in-memory storage (for quick testing)
  rsfga-memory:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - RSFGA_SERVER__HOST=0.0.0.0
      - RSFGA_SERVER__PORT=8080
      - RSFGA_STORAGE__BACKEND=memory
      - RSFGA_LOGGING__LEVEL=debug
      - RSFGA_LOGGING__JSON=false
      - RSFGA_METRICS__ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - memory

  # PostgreSQL database
  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=rsfga
      - POSTGRES_PASSWORD=rsfga
      - POSTGRES_DB=rsfga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsfga -d rsfga"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NATS server with JetStream (required for async writes)
  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"    # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - nats
      - edge
      - precompute

  # RSFGA Writer - consumes writes from NATS and batches to PostgreSQL
  rsfga-writer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: rsfga-writer
    environment:
      - NATS_URL=nats://nats:4222
      - CONSUMER_NAME=rsfga-writer-1
      - STORAGE_BACKEND=postgres
      - DATABASE_URL=postgres://rsfga:rsfga@postgres:5432/rsfga
      - BATCH_SIZE=500
      - BATCH_TIMEOUT_MS=100
      - METRICS_PORT=9090
    ports:
      - "9092:9090"  # Host 9092 to avoid conflict with Prometheus on 9090
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - nats
      - edge
    restart: unless-stopped

  # RSFGA Edge - syncs committed events to edge storage
  # Uses memory storage by default: edge nodes re-bootstrap from the NATS event
  # stream on restart, so persistence is optional. For persistent local cache,
  # switch to rocksdb with a volume mount.
  rsfga-edge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: rsfga-edge
    environment:
      - NATS_URL=nats://nats:4222
      - CONSUMER_NAME=rsfga-edge-1
      - STORAGE_BACKEND=memory
      - BATCH_SIZE=100
      - FETCH_TIMEOUT_MS=500
      - METRICS_PORT=9091
    ports:
      - "9091:9091"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - edge
    restart: unless-stopped

  # Valkey (Redis-compatible) for precomputed check cache
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - precompute
    restart: unless-stopped

  # RSFGA Precompute Worker - precomputes hot-path check results to Valkey
  rsfga-precompute:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: rsfga-precompute
    ports:
      - "9093:9092"  # Host 9093 to avoid conflict with writer on 9092
    environment:
      - NATS_URL=nats://nats:4222
      - CONSUMER_NAME=rsfga-precompute-1
      - STORAGE_BACKEND=postgres
      - DATABASE_URL=postgres://rsfga:rsfga@postgres:5432/rsfga
      - VALKEY_URL=redis://valkey:6379
      - VALKEY_RESULT_TTL=300
      - VALKEY_HOTPATH_TTL=3600
      - WORKERS=4
      - MAX_QUEUE_DEPTH=10000
      - METRICS_PORT=9092
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - precompute
    restart: unless-stopped

  # Jaeger for distributed tracing (optional)
  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "6831:6831/udp"   # Jaeger agent (compact thrift)
      - "16686:16686"     # Jaeger UI
      - "14268:14268"     # Jaeger collector HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    profiles:
      - observability

  # Prometheus for metrics scraping (optional)
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    profiles:
      - observability

volumes:
  postgres_data:
  nats_data:
  valkey_data:
